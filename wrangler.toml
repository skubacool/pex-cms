# The CMS is served by a small Cloudflare Worker that only hands out the built files in ./dist.
# Deploy with: npm run deploy
name = "pex-cms"
compatibility_date = "2026-11-01"

# One public address only: no *.workers.dev copy of the admin app.
workers_dev = false
preview_urls = false

routes = [
  { pattern = "cms.powerexpress1980.com", custom_domain = true },
]

[assets]
directory = "./dist"
